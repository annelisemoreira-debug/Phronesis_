<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>CRUD Funcionário</title>

<style>

body{
    font-family: Arial;
    background:#f4f4f4;
}

.container{
    width:700px;
    margin:auto;
    margin-top:40px;
    background:white;
    padding:20px;
    border-radius:8px;
}

h2{
    text-align:center;
}

input{
    width:100%;
    padding:8px;
    margin-bottom:10px;
}

button{
    padding:8px 12px;
    cursor:pointer;
}

.salvar{
    background:green;
    color:white;
}

.listar{
    background:blue;
    color:white;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

th, td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
}

th{
    background:#333;
    color:white;
}

</style>

</head>

<body>

<div class="container">

<h2>Cadastro de Funcionário</h2>

<input type="hidden" id="id_cadastro">

Nome:
<input type="text" id="nome">

E-mail:
<input type="text" id="email">

Senha:
<input type="password" id="senha">

Telefone:
<input type="text" id="telefone">

<button class="salvar" onclick="salvar()">Salvar</button>
<button class="listar" onclick="listar()">Listar</button>

<h2>Lista de Funcionários</h2>

<table>
<thead>
<tr>
<th>ID</th>
<th>Nome</th>
<th>Email</th>
<th>Senha</th>
<th>Telefone</th>
<th>Ações</th>
</tr>
</thead>

<tbody id="tabela"></tbody>

</table>

</div>

<script>

const api = "api.php";

function salvar(){

const id = document.getElementById("id_cadastro").value;

const dados = {
nome: document.getElementById("nome").value,
email: document.getElementById("email").value,
senha: document.getElementById("senha").value,
telefone: document.getElementById("telefone").value
};

if(id){

dados.id_cadastro = id;

fetch(api,{
method:"PUT",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(dados)
})
.then(r=>r.json())
.then(d=>{
alert(d.mensagem);
listar();
limpar();
});

}else{

fetch(api,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(dados)
})
.then(r=>r.json())
.then(d=>{
alert(d.mensagem);
listar();
limpar();
});

}

}

function listar(){

fetch(api)
.then(r=>r.json())
.then(dados=>{

let tabela = document.getElementById("tabela");

tabela.innerHTML="";

dados.forEach(f=>{

tabela.innerHTML+=`
<tr>
<td>${f.id_cadastro}</td>
<td>${f.nome}</td>
<td>${f.email}</td>
<td>${f.senha}</td>
<td>${f.telefone}</td>

<td>
<button onclick="editar(${f.id_cadastro},'${f.nome}','${f.email}','${f.senha}','${f.telefone}')">Editar</button>

<button onclick="excluir(${f.id_cadastro})">Excluir</button>
</td>
</tr>
`;

});

});

}

function editar(id,nome,email,senha,telefone){

document.getElementById("id_cadastro").value=id;
document.getElementById("nome").value=nome;
document.getElementById("email").value=email;
document.getElementById("senha").value=senha;
document.getElementById("telefone").value=telefone;

}

function excluir(id){

if(confirm("Deseja excluir?")){

fetch(api,{
method:"DELETE",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({id_cadastro:id})
})
.then(r=>r.json())
.then(d=>{
alert(d.mensagem);
listar();
});

}

}

function limpar(){

document.getElementById("id_cadastro").value="";
document.getElementById("nome").value="";
document.getElementById("email").value="";
document.getElementById("senha").value="";
document.getElementById("telefone").value="";

}

</script>

</body>
</html>
