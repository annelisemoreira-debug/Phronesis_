<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>CRUD Funcionário</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Funcionário - Phronesis</title>

    <link rel="stylesheet" href="api.css">
</head>
<body>

    

    <header class="navbar">
        <button>Início</button>
        <button>Materiais</button>
        <button>Livros</button>
        <button>Cronogramas</button>
    </header>

    <div class="test-panel">
        <button class="btn-config" onclick="toggleTestButton()" title="Configurações de Teste">⚙️</button>
        <button id="btn-auto-fill" onclick="autoPreencher()">Preencher Automaticamente</button>
    </div>

    <main class="main-container">
        
        <section class="form-section">
            <div class="logo-placeholder">
                <img src="https://via.placeholder.com/200x200?text=PHRONESIS" alt="Logo" style="width:80%">
            </div>

            <div class="form-container">
                <h2>Faça seu login!</h2>
                <p class="subtitle">Não tem uma conta? <span style="color: var(--azul-claro); cursor:pointer">Cadastre-se</span></p>

                <input type="hidden" id="id_cadastro">

                <div class="input-group">
                    <label>Nome:</label>
                    <input type="text" id="nome">
                </div>

                <div class="input-group">
                    <label>E-mail:</label>
                    <input type="text" id="email">
                </div>

                <div class="input-group">
                    <label>Senha:</label>
                    <input type="password" id="senha">
                </div>

                <div class="input-group">
                    <label>Telefone:</label>
                    <input type="text" id="telefone">
                </div>

                <div class="input-group">
                    <label>Observação:</label>
                    <input type="text" id="observacao">
                </div>

                <button class="btn-salvar" onclick="salvar()">Entrar</button>
                <button onclick="listar()" style="background:none; border:none; cursor:pointer; color: var(--roxo-input-texto); text-decoration: underline; margin-left: 15px;">Listar cadastros</button>
            </div>
        </section>

        <section class="table-section">
            <h3>Funcionários Registrados</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Observações</th>
                    </tr>
                </thead>
                <tbody id="tabela"></tbody>
            </table>
        </section>

    </main>

    <script>
        const api = "api.php";

        // --- FUNCIONALIDADES DE TESTE (AGILIZANDO TESTES) ---
        
        function toggleTestButton() {
            const btn = document.getElementById("btn-auto-fill");
            btn.style.display = (btn.style.display === "none" || btn.style.display === "") ? "block" : "none";
        }

        function autoPreencher() {
            const id = document.getElementById("id_cadastro").value;
            
            if (!id) {
                // MODO CADASTRO: Preenche tudo
                const numAleatorio = Math.floor(Math.random() * 1000);
                document.getElementById("nome").value = "Desenvolvedor Teste " + numAleatorio;
                document.getElementById("email").value = `teste${numAleatorio}@email.com`;
                document.getElementById("senha").value = "senha123";
                document.getElementById("telefone").value = "11988887777";
                document.getElementById("observacao").value = "Auto-preenchido para teste de POST";
            } else {
                // MODO ATUALIZAÇÃO: Altera campos mantendo o ID
                document.getElementById("nome").value += " [EDITADO]";
                document.getElementById("observacao").value = "Atualizado via automação às " + new Date().toLocaleTimeString();
            }
        }

        // --- FUNÇÕES CRUD ---

        function salvar() {
            const id = document.getElementById("id_cadastro").value;
            const dados = {
                nome: document.getElementById("nome").value,
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value,
                telefone: document.getElementById("telefone").value,
                observacao: document.getElementById("observacao").value
            };

            const metodo = id ? "PUT" : "POST";
            if (id) dados.id_cadastro = id;

            fetch(api, {
                method: metodo,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dados)
            }).then(r => r.json())
              .then(d => {
                  alert(d.mensagem || d.erro);
                  listar();
                  limpar();
              });
        }

        function listar() {
            fetch(api)
                .then(r => r.json())
                .then(dados => {
                    let tabela = document.getElementById("tabela");
                    tabela.innerHTML = "";
                    dados.forEach(f => {
                        tabela.innerHTML += `
                        <tr>
                            <td>${f.id_cadastro}</td>
                            <td>${f.nome}</td>
                            <td>${f.email}</td>
                            <td>${f.telefone}</td>
                            <td>${f.observacao}</td>
                            <td class="actions">
                                <button class="btn-edit" onclick="editar('${f.id_cadastro}','${f.nome}','${f.email}','${f.senha}','${f.telefone}','${f.observacao}')">Editar</button>
                                <button class="btn-del" onclick="excluir(${f.id_cadastro})">Excluir</button>
                            </td>
                        </tr>`;
                    });
                });
        }

        function editar(id, nome, email, senha, telefone, observacao) {
            document.getElementById("id_cadastro").value = id;
            document.getElementById("nome").value = nome;
            document.getElementById("email").value = email;
            document.getElementById("senha").value = senha;
            document.getElementById("telefone").value = telefone;
            document.getElementById("observacao").value = observacao;
            document.getElementById("form-title").innerText = "Atualizar Cadastro";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function excluir(id) {
            if (confirm("Deseja realmente excluir este funcionário?")) {
                fetch(api, {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id_cadastro: id })
                }).then(r => r.json())
                  .then(d => {
                      alert(d.mensagem);
                      listar();
                  });
            }
        }

        function limpar() {
            document.getElementById("id_cadastro").value = "";
            document.getElementById("nome").value = "";
            document.getElementById("email").value = "";
            document.getElementById("senha").value = "";
            document.getElementById("telefone").value = "";
            document.getElementById("observacao").value = "";
            document.getElementById("form-title").innerText = "Faça seu login!";
        }
    </script>
</body>
</html>
