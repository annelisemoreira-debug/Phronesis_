<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Relacional - Estados</title>
    <style>
        /* (Mantenha seu CSS original aqui) */
        select { width: 100%; padding: 8px; margin-bottom: 10px; }
        .container { width: 800px; margin: auto; background: rgb(206, 164, 255); padding: 20px; border-radius: 8px; font-family: sans-serif;}
    </style>
</head>
<body style="background: #f4f4f4;">

<div class="container">
    <h2>Cadastro de Usuário</h2>
    <input type="hidden" id="id_usuario">

    Nome: <input type="text" id="nome" style="width:97%; padding:8px; margin-bottom:10px;">
    E-mail: <input type="text" id="email" style="width:97%; padding:8px; margin-bottom:10px;">
    Senha: <input type="password" id="senha" style="width:97%; padding:8px; margin-bottom:10px;">
    Telefone: <input type="text" id="telefone" style="width:97%; padding:8px; margin-bottom:10px;">

    Estado (Entidade Forte):
    <select id="fk_id_estado">
        <option value="">Selecione um estado...</option>
    </select>

    <button onclick="salvar()" >Salvar Usuário</button>
    <button onclick="listar()" >Atualizar Lista</button>

    <h2>Usuários Cadastrados</h2>
    <table border="1" width="100%" style="border-collapse: collapse;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Estado (FK)</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela"></tbody>
    </table>
</div>

<script>
const api = "api.php";

// 1. Carrega os estados assim que a página abre
window.onload = () => {
    carregarEstados();
    listar();
};

function carregarEstados() {
    fetch(api + "?buscar_estados=true")
    .then(r => r.json())
    .then(estados => {
        const select = document.getElementById("fk_id_estado");
        estados.forEach(est => {
            let opt = document.createElement("option");
            opt.value = est.id_estado; // Aqui está a Chave Primária
            opt.text = `${est.nome} (${est.sigla})`;
            select.appendChild(opt);
        });
    });
}

function salvar() {
    const id = document.getElementById("id_usuario").value;
    const dados = {
        nome: document.getElementById("nome").value,
        email: document.getElementById("email").value,
        senha: document.getElementById("senha").value,
        telefone: document.getElementById("telefone").value,
        fk_id_estado: document.getElementById("fk_id_estado").value
    };

    const metodo = id ? "PUT" : "POST";
    if(id) dados.id_usuario = id;

    fetch(api, {
        method: metodo,
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(dados)
    })
    .then(r => r.json())
    .then(d => {
        alert(d.mensagem || d.erro);
        listar();
        limpar();
    });
}

function listar() {
    fetch(api)
    .then(r => r.json())
    .then(dados => {
        let tabela = document.getElementById("tabela");
        tabela.innerHTML = "";
        dados.forEach(u => {
            tabela.innerHTML += `
            <tr>
                <td>${u.id_usuario}</td>
                <td>${u.nome}</td>
                <td>${u.nome_estado} (ID: ${u.fk_id_estado})</td>
                <td>
                    <button onclick="editar(${u.id_usuario},'${u.nome}','${u.email}','${u.telefone}',${u.fk_id_estado})">Editar</button>
                    <button onclick="excluir(${u.id_usuario})">Excluir</button>
                </td>
            </tr>`;
        });
    });
}

function editar(id, nome, email, telefone, id_estado) {
    document.getElementById("id_usuario").value = id;
    document.getElementById("nome").value = nome;
    document.getElementById("email").value = email;
    document.getElementById("telefone").value = telefone;
    document.getElementById("fk_id_estado").value = id_estado;
}

function excluir(id) {
    if(confirm("Excluir usuário?")) {
        fetch(api, {
            method: "DELETE",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({id_usuario: id})
        }).then(() => listar());
    }
}

function limpar() {
    document.getElementById("id_usuario").value = "";
    document.getElementById("nome").value = "";
    document.getElementById("email").value = "";
    document.getElementById("senha").value = "";
    document.getElementById("telefone").value = "";
    document.getElementById("fk_id_estado").value = "";
}
</script>
</body>
</html>
